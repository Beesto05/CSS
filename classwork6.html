<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>product card</title>
    <style>
        .card{
            border: 2px solid black;
            width: 300px;
            padding: 30px;
            margin: auto;
            text-align: center;
        }
        .card img{
            width: 200px;
            border: 2px solid black;
            border-radius: 30px 0 30px 0;
        }
        @media(max-width:600px){
            .card{
                margin: auto;
                font-size: 14px;
            }
        }
        @media(orientation:landscape ){
            .card{
                background-color: lightblue;
            }
        }
    </style>
</head>
<body>
    <div class="card">
        <img src="iphone.jpg" alt="Iphone 18 PRO">
        <h1>Iphone 18 Pro</h1>
        <button>Buy Now</button>

    </div>
</body>
</html>
