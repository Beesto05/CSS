<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>webpage</title>
    <style>
        p::first-line{
            font-weight: bold;
        }
        p::first-letter{
            color: red;
            font-size: larger;
        }
        h3 + h3{
            color: green;
        }
        a{
            text-decoration: none;
        }
        
        a:link{
            color: blue;
        }
        a:visited{
            color: purple;
        }
        a:hover {
            color: yellow;
            text-decoration: underline;
        }
        ul li:first-child a{
            color: red;
        }
        div > p{
            font-family: Georgia, 'Times New Roman', Times, serif;
        }
        
    </style>

</head>
<body>
    <h1 style="text-align: center;"><ins>About CSS</ins></h1>
    <div>
    <p>CSS is used to style web pages. It helps make websites attractive and easy to read.</p>
    </div>
    <p>Selectors are used to target HTML elements. They allow different styles for different parts of a webpage.</p>
